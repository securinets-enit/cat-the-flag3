name: "Cat Jail v1"
author: "r3t0x"
attribution: 'Written by [r3t0x](https://r3t0x.me/)'
category: misc
description: |-
  Mimi built a sandbox to keep humans away from her treats.
  She'll happily run your Python... as long as you don't say any of the words she hates.

  Flag format: `SecurinetsENIT{...}`
type: dynamic
extra:
  function: linear
  initial: 200
  decay: 5
  minimum: 100
connection_info: nc localhost 1337
flags:
  - SecurinetsENIT{m1m1_c4nt_r34d_str1ng5_th4t_d0nt_3x15t_y3t}
hints:
  - content: |-
      Mimi only reads what you type. She has no idea what Python builds after she looks away.
    cost: 20
tags:
  - jail
  - python
version: "0.1"
