version: '3.8'

services:
  recon:
    build: .
    ports:
      - "8000:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    restart: unless-stopped

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
