version: '3.8'

services:
  log-poison:
    build: .
    ports:
      - "8002:80"
    read_only: true
    tmpfs:
      - /var/log/apache2
      - /tmp
      - /run
      - /var/run
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    restart: unless-stopped

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
