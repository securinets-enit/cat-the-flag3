version: '3.8'

services:
  log-poison:
    build: .
    ports:
      - "8002:80"
    read_only: true
    tmpfs:
      - /var/log/apache2
      - /tmp
      - /run
      - /var/run
    pids_limit: 100
    mem_limit: 128m
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
