version: '3.8'

services:
  proxy-acl:
    build: .
    ports:
      - "8005:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    depends_on:
      - proxy-acl-backend
    restart: unless-stopped

  proxy-acl-backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 50
    mem_limit: 64m
    restart: unless-stopped

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
