server {
    listen 80;
    server_name _;
    root /var/www/protected/public;
    index index.html;

    location /secret {
        deny all;
        return 403;
    }

    location /files {
        alias /var/www/protected/files/;
        autoindex on;
    }

    location = /ssrf/submit {
        proxy_pass http://proxy-acl-backend:8080/review;
        proxy_set_header X-Review-Source $remote_addr;
        proxy_set_header Host $host;
        add_header X-Request-Status received always;
    }

    location = /login-submit {
        default_type text/html;
        add_header Cache-Control no-store always;
        return 401 '<!doctype html><html><body><h1>Sign-in unavailable</h1><p>The identity service is offline. No credentials are accepted.</p><p><a href="/login.html">Try again</a></p></body></html>';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
