version: '3.8'

services:
  prepared-sqli:
    build: .
    ports:
      - "8008:80"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - prepared-sqli-db
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped

  prepared-sqli-db:
    build:
      context: .
      dockerfile: db.Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: root_pw_2024
      MYSQL_DATABASE: shop
      MYSQL_USER: webapp
      MYSQL_PASSWORD: webapp_pw_2024
    expose:
      - "3306"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    restart: unless-stopped

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
