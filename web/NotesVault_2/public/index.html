<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes Vault v2 (Hard)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 3rem; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; max-width: 600px; border: 1px solid #334155; }
    h1 { color: #38bdf8; margin-top: 0; }
    code { background: #0f172a; color: #f43f5e; padding: 3px 6px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Loading...</h1>
    <p id="content">Fetching encrypted note...</p>
  </div>

  <script>
    (async () => {
      // Get 'file' parameter from hash (e.g. #file=welcome)
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const file = hashParams.get('file') || 'welcome';

      // The client constructs a full URL object before executing fetch()
      const baseUrl = new URL('/api/v1/notes/', window.location.origin);
      
      // Vulnerable resolution: URL constructor automatically normalizes path segments!
      const targetUrl = new URL(file, baseUrl.href);

      try {
        const response = await fetch(targetUrl.href);
        const data = await response.json();

        if (response.ok) {
          document.getElementById('title').innerText = data.title;
          document.getElementById('content').innerText = data.content;
        } else {
          document.getElementById('title').innerText = "Access Denied";
          document.getElementById('content').innerText = data.error || "Failed to load.";
        }
      } catch (err) {
        document.getElementById('title').innerText = "Error";
        document.getElementById('content').innerText = "Client processing error.";
      }
    })();
  </script>
</body>
</html>
