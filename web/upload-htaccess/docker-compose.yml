version: '3.8'

services:
  upload-htaccess:
    build: .
    ports:
      - "8006:80"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run
      - /var/www/html/uploads:mode=1777
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
