version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: gh-cli-fake
    ports:
      - "80:80"
    volumes:
      - ./site:/var/www/site:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/cf-health"]
      interval: 30s
      timeout: 5s
      retries: 3
