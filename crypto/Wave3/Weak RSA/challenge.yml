name: Kamehameha

category: Cryptography

description: |-
  Goku is charging his **Kamehameha** in Dragon Ball: Sparking! Zero, and the message is locked with **RSA**.
  But Goku was in a hurry and picked a tiny public exponent: `e = 3`.

  The modulus `n` is huge, so huge that the message to the power of 3 never even wrapped around it...

  Power up and break through the weak exponent!

  **Author**: [Zanpakto](https://jedjmili.github.io/)

attribution: '[Zanpakto](https://jedjmili.github.io/)'

value: 500

type: dynamic

extra:
  initial: 500
  decay: 15
  minimum: 50

logic: any

flags:
