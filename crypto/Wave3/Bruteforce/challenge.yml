name: Master Lockpick

category: Cryptography

description: |-
  You found a **Master** level chest in a Skyrim dungeon. The guard laughs:
  *"Don't even think about guessing it. You'll never pick that lock."*

  But every real lockpicker knows: you don't open a lock all at once... you feel **one pin at a time**.
  The chest tells you as soon as a pin is wrong.

  Read the source, connect to the chest and grab the loot, Dragonborn.

  *Hint*: a small script is better than a thousand broken lockpicks.

  **Author**: [Zanpakto](https://jedjmili.github.io/)

