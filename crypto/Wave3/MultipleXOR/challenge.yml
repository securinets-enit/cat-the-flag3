name: Hesitation is Defeat

category: Cryptography

description: |-
  The Wolf intercepted three secret messages from the Ashina clan.
  All three were encrypted with **XOR** using the **same key**... a big mistake, shinobi.

  Our spy managed to read the first message before it was burned:

  `There is no shame in losing one battle...`

  Use it to recover the key, then read the remaining messages.
  Hesitation is defeat.

