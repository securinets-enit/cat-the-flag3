name: Defuse the Spike

category: Cryptography

description: |-
  The spike is planted! 30 seconds left on the clock!
  The defuse code is protected with a simple **XOR**, using a repeating key...
  And the key? It's the name of the game you're playing right now.

  Your team is counting on you, agent. Defuse it!

  *Hint*: the flag always starts with `SecurinetsENIT{`. XOR works both ways ;)

  **Author**: [Zanpakto](https://jedjmili.github.io/)

