version: "3.8"

services:
  special_grade_paperwork:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1353:1353"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:size=10M,mode=1777
