services:
  baby_win:
    build: .
    container_name: baby_win
    ports:
      - "5000:5000"
    restart: unless-stopped
    # Basic hardening for shared infra — tune per-host if needed.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m