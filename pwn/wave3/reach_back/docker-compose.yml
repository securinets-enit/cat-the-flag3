services:
  reach_back:
    build: .
    init: true
    privileged: false
    ports:
      - "8001:8001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,exec,nosuid,nodev
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    ulimits:
      nofile:
        soft: 256
        hard: 256
    stop_grace_period: 3s
    healthcheck:
      test:
        - CMD-SHELL
        - printf '\n' | socat -T2 - TCP:127.0.0.1:8001 >/dev/null 2>&1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 96
